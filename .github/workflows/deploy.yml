name: CI/CD Production Build & Deploy

on:
  push:
    branches:
      - master

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js in GitHub Cloud
        working-directory: ./frontend
        run: npm run build

      - name: Package Standalone Artifact
        working-directory: ./frontend
        run: |
          cp -r public .next/standalone/frontend/public
          cp -r .next/static .next/standalone/frontend/.next/static
          tar -czf ../release.tar.gz -C .next/standalone/frontend .

      - name: Deploy to Production via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

          echo "🚀 Transferring release artifact to server..."
          scp -P "$SSH_PORT" release.tar.gz "$SSH_USER@$SSH_HOST:/tmp/release.tar.gz"

          echo "⚡ Executing remote deployment on server..."
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" '
            set -e
            echo "📦 Extracting release artifact..."
            mkdir -p /var/www/alexseif.com/frontend/.standalone
            tar -xzf /tmp/release.tar.gz -C /var/www/alexseif.com/frontend/.standalone
            rm -f /tmp/release.tar.gz

            echo "♻️ Reloading PM2..."
            cd /var/www/alexseif.com
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save

            echo "🩺 Running Health Check on port 3000..."
            sleep 3
            for i in {1..10}; do
              if curl -sf http://127.0.0.1:3000/ > /dev/null; then
                echo "✅ Health check passed! Website is live and healthy."
                exit 0
              fi
              echo "Waiting for Next.js to respond ($i/10)..."
              sleep 1
            done

            echo "❌ Health check failed after 10 seconds! Checking logs:"
            pm2 logs alexseif-frontend --lines 30 --nostream
            exit 1
          '
