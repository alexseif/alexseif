architectural_context: >
  A living cartographic index and web application dedicated to historic bars, rooftops, and 
  nightlife institutions in Downtown Cairo (Wust El Balad). Architected as a decoupled geospatial 
  platform with a Vite 8 + React 19 SPA frontend, a Python FastAPI backend powered by PostgreSQL/PostGIS, 
  and SQLAdmin for entity management. Features client-side vector cartography via MapLibre GL JS, 
  TanStack Query v5 server-state caching, dynamic GeoJSON bounding-box viewport streaming, 
  and an automated multi-tier spatial ingestion/curation pipeline.
