  languages: ["TypeScript", "Python 3.12", "SQL", "HTML5", "CSS3 / TailwindCSS 4"]
  frameworks: ["Vite 8", "React 19", "FastAPI", "SQLAdmin", "MapLibre GL JS", "TanStack Query v5"]
  infrastructure_cloud: ["Docker / Docker Compose", "Nginx (Reverse Proxy)", "Vercel Analytics"]
