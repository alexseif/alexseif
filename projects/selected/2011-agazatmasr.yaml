project_id: "agazat_masr_tourism"
client_name: "Agazat Masr (Tourico)"
client_type: "Tourism & Hospitality"
project_role: "Software Architect via Mitchdesigns"
timeline:
  start_year: 2011
  end_year: 2014
architectural_context: >
  Egyptian domestic tourism platform inheriting the pricing 
  engine and database abstraction layer from Smashholidays, 
  extended to aggregate packages, excursions, and transport 
  transfers into a unified booking model. Became the Egyptian 
  market's de facto pricing reference within 4-6 months of 
  launch — competing tour operators began screen-scraping 
  daily HTML output, rebranding it, and publishing it as 
  their own pricing sheets.
technical_stack:
  languages: ["PHP"]
  frameworks: ["Custom MVC Framework"]
  infrastructure_cloud: []
  data_layers: [
      "MySQL",
      "Inherited Pricing Schema
      from Smashholidays",
    ]
core_competencies:
  - "Multi-tier Inventory Aggregation"
  - "Asynchronous Booking Orchestration"
  - "Pricing Engine Architecture"
  - "System Lifecycle Management"
quantifiable_engineering_impact:
  - "Became Egypt's #1 domestic tourism pricing reference
    within 4–6 months of launch — market adoption
    confirmed by competing operators screen-scraping and
    rebranding daily output as their own published rates."
  - "Built asynchronous email booking engine abstracting
    the absence of real-time supplier APIs — captured
    user intent, serialized transaction receipts, and
    managed operator confirmation workflows without
    live integration."
  - "Maintained and extended platform across 36-month
    release roadmap without production downtime, inheriting
    and evolving the Smashholidays pricing schema under
    live traffic."
edge_cases_managed:
  - "No real-time booking APIs available from suppliers —
    entire transaction flow designed around asynchronous
    confirmation with serialized receipt generation."
  - "Table lock contention during peak seasonal traffic —
    resolved through query boundary optimization."
  - "Competitors reverse-engineering pricing output —
    proprietary booking logic encapsulated in
    server-side OOP, inaccessible from scraped HTML."
