project_id: "smash_holidays_booking"
client_name: "Smash Holidays"
client_type: "Tour Operator"
project_role: "Lead Systems Architect via Mitchdesigns"
timeline:
  start_year: 2009
  end_year: 2012
architectural_context: >
  Custom travel booking and inventory engine built before 
  modern booking APIs and Composer existed. Hotels lacked 
  universal GDS connectivity, requiring a custom inventory 
  schema handling time-period pricing, last-minute rates, 
  early bird incentives, gala night surcharges, adult/child 
  variants, amenity pricing, and stop-sale signals — all 
  resolved at query time against user-selected dates, 
  destination, and party composition.
technical_stack:
  languages: ["PHP"]
  frameworks: ["Custom MVC Framework (pre-Composer)"]
  infrastructure_cloud: ["Media Temple (shared hosting)"]
  data_layers: ["MySQL", "Optimized Views", "Relational Pricing Schema"]
core_competencies:
  - "Complex Pricing Schema Design"
  - "Query Optimization & View Architecture"
  - "Custom MVC Framework Development"
  - "GDS & Non-GDS Inventory Normalization"
  - "Shared Hosting Resource Constraint Engineering"
quantifiable_engineering_impact:
  - "Reduced catastrophic multi-factor pricing query
    (minutes to respond) to sub-second execution by
    progressively optimizing nested SQL and packaging
    stable computation layers into pre-computed indexed
    MySQL views — eliminating PHP-side loops entirely
    from the critical path."
  - "Designed a heterogeneous ingestion layer normalizing
    GDS XML feeds, Excel exports, and unstructured email
    data into a single unified availability and pricing
    ledger."
  - "Built custom MVC framework isolating booking business
    logic from UI rendering, enabling rapid feature
    deployment across seasonal pricing cycles without
    touching core logic."
edge_cases_managed:
  - "Shared hosting kmemsize limits: resolved server
    resource exhaustion by flattening query hierarchies
    and eliminating object-relational mapping overhead."
  - "Hotels without GDS: built direct CMS and manual
    pricing ingestion paths alongside automated feeds,
    unified into the same availability model."
  - "Stop-sale, early bird, and gala night constraints:
    implemented as business-logic triggers enforced at
    query level, not application level."
