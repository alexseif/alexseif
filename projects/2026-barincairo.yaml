architectural_context: "A living cartographic index and web application dedicated to historic bars, rooftops, and nightlife institutions in Downtown Cairo (Wust El Balad). Architected with Next.js 16 App Router, TypeScript, and MapLibre GL for client-side spatial map rendering, with integrated Vercel Analytics and Google Analytics (GA4) via @next/third-parties."
technical_stack:
  languages: ["TypeScript", "HTML5", "CSS3 / TailwindCSS 4"]
  frameworks: ["Next.js 16 (App Router)", "React 19", "MapLibre GL"]
  infrastructure_cloud: ["Docker", "Nginx", "Vercel Analytics", "Google Analytics (GA4)"]
  data_layers: ["PostgreSQL", "GeoJSON"]
core_competencies:
  - "Next.js 16 App Router Architecture"
  - "Cartographic Web GIS Integration"
  - "Google Analytics 4 & Web Analytics Integration"
  - "AI-Assisted Pair Programming & Autonomous Agent Orchestration (Antigravity CLI, Gemini 3.6 Flash)"
  - "SEO Optimization & JSON-LD Structured Data"
quantifiable_engineering_impact:
  - "Architected a responsive cartographic web application delivering sub-second page loads and dynamic spatial vector mapping."
  - "Structured JSON-LD schema (ItemList, BarOrPub) for search engine indexing of Downtown Cairo venues."
  - "Integrated Google Analytics (GA4) via @next/third-parties to track user analytics without degrading Core Web Vitals."
edge_cases_managed:
  - "Handled SSR hydration and dynamic client-side rendering for WebGL-dependent MapLibre components."
  - "Configured dual-environment analytics loading to eliminate script execution during local development."
