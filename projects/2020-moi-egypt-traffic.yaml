project_id: "moi_airgapped_driver_lms"
client_name: "Egyptian Ministry of Interior
  (Traffic Police Department)"
client_type: "Public Sector — Federal"
project_role: "Senior Software Engineer & Systems Architect
  via iSoft"
timeline:
  start_year: 2021
  end_year: 2022
  note: "Confirm exact dates — cannot be 2020 if iSoft
    retainer began January 2021"
architectural_context: >
  Mandatory driver instruction and certification LMS for all 
  civilian and commercial heavy-machinery license applicants 
  across Egypt. Operated entirely within a state intranet 
  with zero internet connectivity by security mandate. 
  No external package repositories, no remote access, 
  no developer presence on-site during operation. 
  System had to be self-sufficient, fault-tolerant, and 
  executable by non-technical ministry personnel holding 
  high-level security clearance.
technical_stack:
  languages: ["PHP 7.0.33", "Bash"]
  frameworks: ["Moodle LMS"]
  infrastructure_cloud: [
      "Oracle Linux 7.6 (air-gapped,
      on-premise state infrastructure)",
    ]
  data_layers: ["MySQL 5.7"]
core_competencies:
  - "Air-Gapped Deployment Architecture"
  - "Custom Linux Distribution Configuration"
  - "Fault-Tolerant Bash Automation"
  - "Offline DevOps Pipeline Design"
  - "UX Design for Low-Literacy Populations"
  - "Security-Constrained Systems Engineering"
quantifiable_engineering_impact:
  - "Engineered a zero-network deployment pipeline by
    custom-patching Oracle Linux 7.6 to use a physical
    USB drive as a localized package repository —
    eliminating all external network dependencies from
    the installation and upgrade lifecycle."
  - "Authored fault-tolerant Bash automation scripts
    enabling non-technical ministry personnel with
    high-level security clearance to execute complex
    multi-branch Git merges, schema migrations, and
    configuration state updates — without developer
    access, without network connectivity, and without
    failure tolerance for error."
  - "Designed iconography-driven UX flows to serve a
    demographically diverse user base with significant
    literacy variance, while maintaining strict
    compliance with legal testing mandates."
  - "Implemented offline billing voucher generation
    operating entirely within the air-gapped environment,
    with no external payment network dependencies."
edge_cases_managed:
  - "Absolute network isolation: all package management,
    version control operations, and schema migrations
    had to execute without any internet or intranet
    gateway access."
  - "Operator constraint: on-site personnel had security
    clearance but zero technical background — upgrade
    scripts had to be deterministic, self-validating,
    and recoverable without developer intervention."
  - "PHP 7.0.33 constraint: legacy runtime imposed by
    the ministry's locked infrastructure — all
    development had to remain within that version's
    boundaries regardless of upstream Moodle requirements."
  - "Multi-branch Git operations in an offline environment
    — standard Git workflows assume network access for
    remote operations; all merge and deployment logic
    had to be pre-packaged and locally executable."
